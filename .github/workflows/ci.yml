# .github/workflows/ci.yml
name: CI
on: [push, pull_request]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Put the dataset in place
        run: cp data/source/winequality-red.csv data/raw/
      - name: Validate the raw data
        run: python src/validate.py --path data/source/winequality-red.csv
      - name: Run the pipeline
        run: dvc repro --force
      - name: Show the metrics
        run: dvc metrics show
      - name: Fail if the model got worse
        run: python src/check_f1.py